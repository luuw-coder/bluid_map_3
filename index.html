<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản Đồ Băng Giá</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(180deg, #dff2ff 0%, #a3d2ec 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #app { position: relative; width: 100vw; height: 100vh; }

  #title {
    position: absolute; top: 14px; left: 18px; z-index: 20;
    color: #f4f9fd; font-size: 17px; font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
    display: flex; align-items: center; gap: 6px;
  }

  #viewport {
    position: absolute; inset: 0; overflow: hidden; cursor: grab;
    touch-action: none;
  }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  svg#mapSvg { display: block; overflow: visible; }

  /* Ô nút bấm — KHÔNG có hover transform để tránh xung đột với pan */
  .tile-group { pointer-events: none; }
  .tile-shadow { fill: rgba(20, 45, 65, 0.25); }
  .tile-icon {
    font-size: 21px; text-anchor: middle; dominant-baseline: central;
    user-select: none;
  }
  .tile-icon-overlay {
    font-size: 17px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .deco-icon {
    font-size: 30px; text-anchor: middle; dominant-baseline: central;
    user-select: none;
  }
  .deco-shadow { fill: rgba(20,45,30,0.15); }

  .path-shadow-line { stroke: rgba(20,45,30,0.14); stroke-width: 40; stroke-linecap: round; }
  .path-casing-line { stroke: #c9a15f; stroke-width: 40; stroke-linecap: round; }
  .path-fill-line { stroke: #ffefc9; stroke-width: 30; stroke-linecap: round; }
  .path-fill-line.edge-danger { stroke: #ffd4b0; }
  .path-fill-line.edge-safe { stroke: #cdeeff; }

  .path-arrow-bg { fill: #4aa3e0; stroke: #ffffff; stroke-width: 2.5; }
  .path-arrow-tri { fill: #ffffff; }

  #zoomCtrls {
    position: absolute; left: 16px; bottom: 16px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(13,43,69,0.85); border: 1px solid rgba(255,255,255,0.15);
    color: #f4f9fd; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:hover { background: rgba(30,70,100,0.95); }
</style>
</head>
<body>
<div id="app">
  <div id="title">❄️ Bản Đồ Băng Giá</div>

  <div id="viewport">
    <div id="world">
      <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div id="zoomCtrls">
    <button class="zoom-btn" id="zoomIn">+</button>
    <button class="zoom-btn" id="zoomOut">−</button>
  </div>
</div>

  { id: 'b5_3', x: 9,  y: 7, type: 'lucky',  next: ['m5'] },

  // hợp nhất #5
  { id: 'm5', x: 8, y: 6, type: 'chest', next: ['s50'] },

  { id: 's50', x: 7, y: 6, type: 'normal',   next: ['s51'] },
  { id: 's51', x: 6, y: 6, type: 'money',    next: ['s52'] },
  { id: 's52', x: 5, y: 6, type: 'normal',   next: ['s53'] },
  { id: 's53', x: 4, y: 6, type: 'mystery',  next: ['s54'] },
  { id: 's54', x: 3, y: 6, type: 'normal',   next: ['s55'] },
  { id: 's55', x: 2, y: 6, type: 'territory',next: ['s56'] },
  { id: 's56', x: 1, y: 6, type: 'normal',   next: ['s57'] },
  { id: 's57', x: 0, y: 6, type: 'chest',    next: ['s58'] },
  { id: 's58', x: 0, y: 7, type: 'normal',   next: ['s59'] },
  { id: 's59', x: 1, y: 7, type: 'money',    next: ['s60'] },
  { id: 's60', x: 2, y: 7, type: 'normal',   next: ['s61'] },
  { id: 's61', x: 3, y: 7, type: 'lucky',    next: ['s62'] },
  { id: 's62', x: 4, y: 7, type: 'normal',   next: ['s63'] },
  { id: 's63', x: 5, y: 7, type: 'penalty',  next: ['s64'] },
  { id: 's64', x: 6, y: 7, type: 'normal',   next: ['s65'] },
  { id: 's65', x: 7, y: 7, type: 'heal',     next: ['s66'] },
  { id: 's66', x: 8, y: 7, type: 'normal',   next: ['finish'] },

  { id: 'finish', x: 8, y: 8, type: 'finish', next: [] },
];

// Cạnh thuộc nhánh nguy hiểm / an toàn — tô màu path khác nhau
const BRANCH_EDGES = {
  danger: [
    ['s4','a1'],['a1','a2'],['a2','a3'],['a3','m1'],
    ['s14','a2_1'],['a2_1','a2_2'],['a2_2','m2'],
    ['s23','a3_1'],['a3_1','a3_2'],['a3_2','m3'],
    ['s34','a4_1'],['a4_1','a4_2'],['a4_2','m4'],
    ['s45','a5_1'],['a5_1','a5_2'],['a5_2','m5'],
  ],
  safe: [
    ['s4','b1'],['b1','b2'],['b2','b3'],['b3','b4'],['b4','m1'],
    ['s14','b2_1'],['b2_1','b2_2'],['b2_2','b2_3'],['b2_3','m2'],
    ['s23','b3_1'],['b3_1','b3_2'],['b3_2','b3_3'],['b3_3','m3'],
    ['s34','b4_1'],['b4_1','b4_2'],['b4_2','b4_3'],['b4_3','m4'],
    ['s45','b5_1'],['b5_1','b5_2'],['b5_2','b5_3'],['b5_3','m5'],
  ],
};

// ------------------------------------------------------------
// Vật trang trí
// ------------------------------------------------------------
const DECORATIONS = [
  { icon: '🌲', x: 0.5,  y: 4.5 }, { icon: '🌲', x: 9.5,  y: 1.4 },
  { icon: '🌲', x: 6.5,  y: 3.4 }, { icon: '🌲', x: 3.4,  y: 0.5 },
  { icon: '🌲', x: 11.5, y: 5.5 }, { icon: '🌲', x: 7.5,  y: 8.4 },
  { icon: '🌲', x: 0.4,  y: 6.6 }, { icon: '🌲', x: 5.6,  y: 6.4 },
  { icon: '🌲', x: 9.6,  y: 6.4 },

  { icon: '❄️', x: 2.4,  y: 0.6 }, { icon: '❄️', x: 10.5, y: 3.4 },
  { icon: '❄️', x: 6.5,  y: 1.5 }, { icon: '❄️', x: 8.6,  y: 5.5 },
  { icon: '❄️', x: 1.4,  y: 4.6 },

  { icon: '⛄', x: 8.6,  y: 3.4 }, { icon: '⛄', x: 3.5,  y: 8.6 },
  { icon: '⛄', x: 0.5,  y: 8.4 },

  { icon: '🪨', x: 6.5,  y: 4.6 }, { icon: '🪨', x: 3.4,  y: 3.4 },
  { icon: '🪨', x: 10.5, y: 7.5 },

  { icon: '🧊', x: 9.4,  y: 2.4 }, { icon: '🧊', x: 1.5,  y: 5.5 },
];

const ICE_LAKES = [
  { x: 9.5, y: 1.5, rx: 1.0, ry: 0.65 },
  { x: 6.5, y: 4.5, rx: 1.0, ry: 0.65 },
];

const MAP_CONFIG = { cols: 12, rows: 9 };

// Ánh xạ loại ô -> asset ảnh sprite đã có sẵn (5 loại từ bộ asset đầu tiên).
// Loại nào chưa có sprite riêng (bạn sẽ làm bổ sung sau) thì dùng
// btnBlankPurple làm nền, vẫn giữ emoji đè lên để phân biệt được.
const TYPE_ASSET = {
  normal:    null, // không icon, chỉ nền path
  chest:     'btnBlankPurple',
  penalty:   'btnSkullRed',
  lucky:     'btnDiceGold',
  territory: 'btnBlankPurple',
  mystery:   'btnBlankPurple',
  money:     'btnBlankPurple',
  heal:      'btnHealGreen',
  double:    'btnDiceGold',
  start:     'btnHealGreen',
  finish:    'btnDiceGold',
};

// Ánh xạ icon trang trí cũ (emoji) -> asset ảnh tương ứng đã cắt
const DECO_ASSET_MAP = {
  '🌲': 'decoSnowpile',   // tạm dùng đống tuyết thay cây (chưa có asset cây)
  '❄️': 'decoIceChunk',
  '⛄': 'decoSnowman',
  '🪨': 'decoRock',
  '🧊': 'decoIceChunk',
};

</script>
<script>
// ============================================================
// MAP RENDERER v4
// - Bỏ hover-scale trên tile (nguyên nhân gây giật khi kéo pan)
// - Bỏ tooltip hover
// - Bỏ mọi nút điều khiển phụ, chỉ giữ zoom +/-
// - Style nút bấm nổi khối rõ hơn, path uốn tự nhiên, nền texture
// ============================================================
console.log('[map-render] script loaded');

(function () {
  try {
    if (typeof TILES === 'undefined') {
      throw new Error('TILES chưa được định nghĩa.');
    }

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const CELL = 96;
    const PAD = 90;

    const svg = document.getElementById('mapSvg');
    const world = document.getElementById('world');
    const viewport = document.getElementById('viewport');

    if (!svg || !world || !viewport) {
      throw new Error('Không tìm thấy #mapSvg / #world / #viewport.');
    }

    function el(tag, attrs = {}) {
      const e = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(20260901);

    const tileIndex = {};
    TILES.forEach(t => tileIndex[t.id] = t);

    function tileCenter(t) { return { cx: PAD + t.x * CELL, cy: PAD + t.y * CELL }; }

    function mapBounds() {
      const maxX = Math.max(...TILES.map(t => t.x), ...DECORATIONS.map(d => d.x));
      const maxY = Math.max(...TILES.map(t => t.y), ...DECORATIONS.map(d => d.y));
      return { width: PAD * 2 + maxX * CELL, height: PAD * 2 + maxY * CELL };
    }

    const branchEdgeKey = (a, b) => a + '>' + b;
    const dangerSet = new Set((BRANCH_EDGES.danger || []).map(([a,b]) => branchEdgeKey(a,b)));
    const safeSet = new Set((BRANCH_EDGES.safe || []).map(([a,b]) => branchEdgeKey(a,b)));
    function branchClass(a, b) {
      const k = branchEdgeKey(a, b);
      if (dangerSet.has(k)) return 'edge-danger';
      if (safeSet.has(k)) return 'edge-safe';
      return 'edge-normal';
    }

    const TYPE_RING = {
      normal:    { ring: '#9db8cc', fill: '#f5f9fc' },
      chest:     { ring: '#e0a94a', fill: '#fff3d9' },
      penalty:   { ring: '#d9564a', fill: '#ffe1de' },
      lucky:     { ring: '#4a90d9', fill: '#e4f0ff' },
      territory: { ring: '#3a5fc0', fill: '#dbe4ff' },
      mystery:   { ring: '#b05ad9', fill: '#f2e0ff' },
      money:     { ring: '#e0b93a', fill: '#fff8d6' },
      heal:      { ring: '#3ec97a', fill: '#dcffec' },
      double:    { ring: '#e08a3a', fill: '#ffe9d2' },
      start:     { ring: '#3ec97a', fill: '#dcffec' },
      finish:    { ring: '#e0b93a', fill: '#fff3c4' },
    };

    // ---------- nền texture (ảnh AI-generated lặp lại được) ----------
    function drawBackground(width, height) {
      const defs = el('defs');

      const btnGrad = el('radialGradient', { id: 'btnGrad', cx: '35%', cy: '28%', r: '80%' });
      btnGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#ffffff' }));
      btnGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#e9f2f8' }));
      defs.appendChild(btnGrad);

      if (typeof ASSETS !== 'undefined' && ASSETS.bgTile) {
        const pattern = el('pattern', {
          id: 'bgPattern', patternUnits: 'userSpaceOnUse',
          x: 0, y: 0, width: 480, height: 480,
        });
        pattern.appendChild(el('image', {
          href: ASSETS.bgTile, x: 0, y: 0, width: 480, height: 480,
          preserveAspectRatio: 'xMidYMid slice',
        }));
        defs.appendChild(pattern);
        svg.appendChild(defs);
        svg.appendChild(el('rect', {
          x: -400, y: -400, width: width + 800, height: height + 800, fill: 'url(#bgPattern)',
        }));
      } else {
        // fallback nếu chưa có ảnh nền
        const groundGrad = el('linearGradient', { id: 'groundGrad', x1: '0%', y1: '0%', x2: '30%', y2: '100%' });
        groundGrad.appendChild(el('stop', { offset: '0%', 'stop-color': '#e4f4ff' }));
        groundGrad.appendChild(el('stop', { offset: '100%', 'stop-color': '#a3d2ec' }));
        defs.appendChild(groundGrad);
        svg.appendChild(defs);
        svg.appendChild(el('rect', {
          x: -400, y: -400, width: width + 800, height: height + 800, fill: 'url(#groundGrad)',
        }));
      }
    }

    function drawIceLakes() {
      const g = el('g');
      (ICE_LAKES || []).forEach(lake => {
        const cx = PAD + lake.x * CELL, cy = PAD + lake.y * CELL;
        const rx = lake.rx * CELL, ry = lake.ry * CELL;
        g.appendChild(el('ellipse', { cx: cx+6, cy: cy+8, rx, ry, fill: '#6fb3d6', opacity: 0.3 }));
        g.appendChild(el('ellipse', { cx, cy, rx, ry, fill: '#a3e0f7', opacity: 0.85, stroke: '#ffffff', 'stroke-width': 3 }));
        g.appendChild(el('ellipse', { cx: cx-rx*0.28, cy: cy-ry*0.32, rx: rx*0.32, ry: ry*0.2, fill: '#ffffff', opacity: 0.55 }));
      });
      svg.appendChild(g);
    }

    // ---------- path ----------
    function drawPaths() {
      const gShadow = el('g');
      const gCasing = el('g');
      const gFill = el('g');
      const gArrows = el('g');

      TILES.forEach(t => {
        t.next.forEach(nId => {
          const to = tileIndex[nId];
          if (!to) { console.warn('[map-render] cạnh hỏng:', t.id, '->', nId); return; }
          const c1 = tileCenter(t), c2 = tileCenter(to);
          const cls = branchClass(t.id, to.id);

          gShadow.appendChild(el('line', { x1: c1.cx, y1: c1.cy+5, x2: c2.cx, y2: c2.cy+5, class: 'path-shadow-line' }));
          gCasing.appendChild(el('line', { x1: c1.cx, y1: c1.cy, x2: c2.cx, y2: c2.cy, class: 'path-casing-line' }));
          gFill.appendChild(el('line', { x1: c1.cx, y1: c1.cy, x2: c2.cx, y2: c2.cy, class: `path-fill-line ${cls}` }));

          const mx = (c1.cx + c2.cx) / 2, my = (c1.cy + c2.cy) / 2;
          const angle = Math.atan2(c2.cy - c1.cy, c2.cx - c1.cx) * 180 / Math.PI;
          const arrowGroup = el('g', { transform: `translate(${mx},${my}) rotate(${angle})` });
          arrowGroup.appendChild(el('circle', { r: 14, class: 'path-arrow-bg' }));
          arrowGroup.appendChild(el('polygon', { points: '-4,-6 6,0 -4,6', class: 'path-arrow-tri' }));
          gArrows.appendChild(arrowGroup);
        });
      });

      svg.appendChild(gShadow);
      svg.appendChild(gCasing);
      svg.appendChild(gFill);
      svg.appendChild(gArrows);
    }

    // ---------- trang trí (ảnh sprite nếu có, fallback emoji) ----------
    function drawDecorations() {
      const g = el('g');
      (DECORATIONS || []).forEach((d, i) => {
        const cx = PAD + d.x * CELL, cy = PAD + d.y * CELL;
        const wrap = el('g', { transform: `translate(${cx},${cy})` });

        const assetKey = (typeof DECO_ASSET_MAP !== 'undefined') ? DECO_ASSET_MAP[d.icon] : null;
        const hasAsset = typeof ASSETS !== 'undefined' && assetKey && ASSETS[assetKey];

        if (hasAsset) {
          // kích thước hiển thị ngẫu nhiên nhẹ để tự nhiên hơn (seeded theo index)
          const jitter = 0.85 + (i % 5) * 0.06;
          const size = 46 * jitter;
          wrap.appendChild(el('ellipse', { cx: 2, cy: size*0.42, rx: size*0.42, ry: size*0.14, class: 'deco-shadow' }));
          wrap.appendChild(el('image', {
            href: ASSETS[assetKey],
            x: -size/2, y: -size/2, width: size, height: size,
          }));
        } else {
          wrap.appendChild(el('ellipse', { cx: 2, cy: 13, rx: 15, ry: 5, class: 'deco-shadow' }));
          const t = el('text', { x: 0, y: 0, class: 'deco-icon' });
          t.textContent = d.icon;
          wrap.appendChild(t);
        }
        g.appendChild(wrap);
      });
      svg.appendChild(g);
    }

    // ---------- ô: dùng sprite nút thật khi có, fallback vẽ CSS ----------
    // KHÔNG hover-scale (nguyên nhân gây giật khi kéo pan trước đây)
    function drawTiles() {
      const g = el('g');
      TILES.forEach(t => {
        const { cx, cy } = tileCenter(t);
        const info = TILE_TYPES[t.type] || { icon: '?', label: t.type };
        const colors = TYPE_RING[t.type] || TYPE_RING.normal;
        const isTerminal = t.type === 'start' || t.type === 'finish';
        const r = isTerminal ? 29 : 25;

        const group = el('g', { class: 'tile-group', 'data-tile': t.id });

        const assetKey = (typeof TYPE_ASSET !== 'undefined') ? TYPE_ASSET[t.type] : null;
        const hasAsset = typeof ASSETS !== 'undefined' && assetKey && ASSETS[assetKey];

        if (hasAsset) {
          const size = r * 2.3;
          group.appendChild(el('ellipse', { cx, cy: cy + r*0.55, rx: r*0.9, ry: r*0.28, class: 'tile-shadow' }));
          group.appendChild(el('image', {
            href: ASSETS[assetKey], x: cx - size/2, y: cy - size/2, width: size, height: size,
          }));
          // với ô có sprite "trống" (blank purple), vẫn vẽ icon emoji đè lên để phân biệt loại
          if (assetKey === 'btnBlankPurple') {
            const icon = el('text', { x: cx, y: cy + 1, class: 'tile-icon tile-icon-overlay' });
            icon.textContent = info.icon;
            group.appendChild(icon);
          }
        } else {
          group.appendChild(el('circle', { cx, cy: cy + 4, r, class: 'tile-shadow' }));
          group.appendChild(el('circle', { cx, cy, r: r + 4, fill: colors.ring }));
          group.appendChild(el('circle', { cx, cy, r, fill: 'url(#btnGrad)', stroke: colors.ring, 'stroke-width': 1.5 }));
          group.appendChild(el('ellipse', { cx: cx - r*0.35, cy: cy - r*0.4, rx: r*0.35, ry: r*0.2, fill: '#ffffff', opacity: 0.6 }));
          const icon = el('text', { x: cx, y: cy + 1, class: 'tile-icon' });
          icon.textContent = info.icon;
          group.appendChild(icon);
        }

        g.appendChild(group);
      });
      svg.appendChild(g);
    }

    // ---------- pan & zoom (fix: dùng ngưỡng kéo để tránh xung đột) ----------
    let scale = 1, minScale = 0.35, maxScale = 2.4;
    let panX = 0, panY = 0;
    let isPointerDown = false, isDragging = false;
    let dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
    const DRAG_THRESHOLD = 4;

    function applyTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function centerView(width, height) {
      const vw = viewport.clientWidth || window.innerWidth;
      const vh = viewport.clientHeight || window.innerHeight;
      scale = Math.max(Math.min(vw / width, vh / height, 1) * 0.94, minScale);
      panX = (vw - width * scale) / 2;
      panY = (vh - height * scale) / 2;
      applyTransform();
    }

    viewport.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      isDragging = false;
      dragStartX = e.clientX; dragStartY = e.clientY;
      panStartX = panX; panStartY = panY;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      if (!isDragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
        isDragging = true;
        viewport.classList.add('dragging');
      }
      if (isDragging) {
        panX = panStartX + dx;
        panY = panStartY + dy;
        applyTransform();
      }
    });

    function endPointer(e) {
      isPointerDown = false;
      isDragging = false;
      viewport.classList.remove('dragging');
    }
    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);
    viewport.addEventListener('pointerleave', () => { if (isPointerDown) endPointer(); });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      const newScale = Math.min(maxScale, Math.max(minScale, scale + delta));
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / scale, wy = (my - panY) / scale;
      scale = newScale;
      panX = mx - wx * scale;
      panY = my - wy * scale;
      applyTransform();
    }, { passive: false });

    // pinch zoom cơ bản cho mobile (dùng touch riêng vì Pointer Events không gộp 2 điểm)
    let touchStartDist = null, touchStartScale = 1;
    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isPointerDown = false; isDragging = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        touchStartScale = scale;
      }
    }, { passive: true });
    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && touchStartDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale = Math.min(maxScale, Math.max(minScale, touchStartScale * (dist / touchStartDist)));
        applyTransform();
      }
    }, { passive: true });
    viewport.addEventListener('touchend', () => { touchStartDist = null; });

    function bindButton(id, fn) {
      const b = document.getElementById(id);
      if (b) b.addEventListener('click', fn);
    }
    bindButton('zoomIn', () => { scale = Math.min(maxScale, scale + 0.15); applyTransform(); });
    bindButton('zoomOut', () => { scale = Math.max(minScale, scale - 0.15); applyTransform(); });

    // ---------- init ----------
    function init() {
      const { width, height } = mapBounds();
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

      drawBackground(width, height);
      drawIceLakes();
      drawPaths();
      drawDecorations();
      drawTiles();

      centerView(width, height);
      console.log('[map-render] Vẽ map thành công:', TILES.length, 'ô,', TILES.filter(t=>t.next.length>1).length, 'điểm rẽ nhánh');
    }

    window.addEventListener('resize', () => {
      const { width, height } = mapBounds();
      centerView(width, height);
    });

    init();
  } catch (err) {
    console.error('[map-render] LỖI:', err);
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#c0392b;color:#fff;padding:16px;border-radius:10px;z-index:9999;font-family:monospace;white-space:pre-wrap;';
    box.textContent = 'Lỗi khi vẽ bản đồ: ' + (err && err.message ? err.message : err);
    document.body.appendChild(box);
  }
})();

</script>
